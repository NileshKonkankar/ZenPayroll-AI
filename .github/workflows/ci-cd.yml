name: ZenPayroll AI CI/CD

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint & Test Suite
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run Linter
        run: npm run lint

      - name: Run Unit Tests
        run: npm run test

      - name: Build Code
        run: npm run build

  docker-dry-run:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: lint-and-test
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image (Dry Run)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: zenpayroll-ai:test-verify
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-cloud-run:
    name: Deploy to Google Cloud Run
    runs-on: ubuntu-latest
    needs: [lint-and-test, docker-dry-run]
    # Only run deploy on master/main push event
    if: |
      github.event_name == 'push' && 
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Gracefull fallback: check for GCP secrets in order to prevent workflow failures under unconfigured states
      - name: Check GCP Credentials Availability
        id: check_gcp
        run: |
          if [ -z "${{ secrets.GCP_SA_KEY }}" ] || [ -z "${{ secrets.GCP_PROJECT_ID }}" ]; then
            echo "::warning title=Deployment Skipped::GCP_SA_KEY and/or GCP_PROJECT_ID are not configured in GitHub Secrets. Skipping continuous deployment steps."
            echo "has_creds=false" >> $GITHUB_OUTPUT
          else
            echo "has_creds=true" >> $GITHUB_OUTPUT
          fi

      - name: Authenticate with Google Cloud
        if: steps.check_gcp.outputs.has_creds == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        if: steps.check_gcp.outputs.has_creds == 'true'
        uses: google-github-actions/setup-gcloud@v2

      - name: Authorize Docker Push to Google Artifact Registry
        if: steps.check_gcp.outputs.has_creds == 'true'
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build and Push Docker Image
        if: steps.check_gcp.outputs.has_creds == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/zenpayroll-ai/app:${{ github.sha }}
            us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/zenpayroll-ai/app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Cloud Run
        if: steps.check_gcp.outputs.has_creds == 'true'
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: zenpayroll-ai
          image: us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/zenpayroll-ai/app:${{ github.sha }}
          region: us-central1
          flags: '--allow-unauthenticated --port=3000'
          env_vars: |
            NODE_ENV=production
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}

      - name: Deploy Firestore Rules using Firebase CLI
        if: steps.check_gcp.outputs.has_creds == 'true'
        run: |
          npm install -g firebase-tools
          firebase deploy --only firestore:rules --project=${{ secrets.GCP_PROJECT_ID }}
